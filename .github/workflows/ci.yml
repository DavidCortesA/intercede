name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Servicios que NO se levantan del Supabase local (Mailpit y Storage sí: correos y avatares).
env:
  SUPABASE_EXCLUDE: studio,imgproxy,edge-runtime,logflare,vector,supavisor

jobs:
  check:
    name: Typecheck, lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  db:
    name: Base de datos (migraciones, tipos, RLS y Realtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start -x $SUPABASE_EXCLUDE
      - name: Los tipos generados están al día
        run: |
          npm run db:types
          git diff --exit-code src/types/database.ts
      - run: npm run test:db
      - run: npx supabase stop
        if: always()

  e2e:
    name: Build y pruebas e2e (con Supabase local)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx supabase start -x $SUPABASE_EXCLUDE
      # Exporta la URL y las claves del Supabase local (enmascaradas) para el build y las pruebas
      - run: node scripts/lib/local-supabase.mjs --github-env
      - run: npm run build
      # Las pruebas de audio usan LiveKit Cloud: se saltan solas si no hay secretos configurados
      # (Settings → Secrets → Actions: LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET).
      - run: npm run test:e2e
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      - run: npx supabase stop
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
